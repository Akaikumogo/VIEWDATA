<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" fill="none">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.045" />
    </pattern>
    <radialGradient id="tint" cx="0.78" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#5fd4ad" stop-opacity="0.07" />
      <stop offset="1" stop-color="#5fd4ad" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0a0a0b" />
      <stop offset="0.38" stop-color="#0a0a0b" stop-opacity="0.9" />
      <stop offset="0.5" stop-color="#0a0a0b" stop-opacity="0" />
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="420" rx="24" /></clipPath>
    <style>
      .sans { font-family: Geist, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'Geist Mono', 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace; }
      .rise { opacity: 0; animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .node { opacity: 0; animation: node 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .edge { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.3s cubic-bezier(0.65, 0, 0.35, 1) forwards; }
      .d1 { animation-delay: 0.10s; } .d2 { animation-delay: 0.22s; } .d3 { animation-delay: 0.34s; }
      .d4 { animation-delay: 0.46s; } .d5 { animation-delay: 0.58s; }
      .n1 { animation-delay: 0.30s; } .n2 { animation-delay: 0.45s; } .n3 { animation-delay: 0.60s; }
      .n4 { animation-delay: 0.75s; } .n5 { animation-delay: 0.90s; }
      .e1 { animation-delay: 1.15s; } .e2 { animation-delay: 1.35s; } .e3 { animation-delay: 1.55s; } .e4 { animation-delay: 1.75s; }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes node { from { opacity: 0; transform: translateY(14px) scale(0.98); } to { opacity: 1; transform: none; } }
      @keyframes draw { to { stroke-dashoffset: 0; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="420" fill="#0a0a0b" />
    <rect width="1280" height="420" fill="url(#dots)" />
    <rect width="1280" height="420" fill="url(#tint)" />

    <!-- schema illustration -->
    <g class="mono" font-size="11.5">
      <g class="node n1">
        <rect x="690.5" y="64.5" width="150" height="103" rx="10" fill="#131315" stroke="#ffffff" stroke-opacity="0.08" />
        <text x="704" y="86" fill="#e4e4e7" font-size="12">customers</text>
        <line x1="691" x2="840" y1="96.5" y2="96.5" stroke="#ffffff" stroke-opacity="0.06" />
        <text x="704" y="111" fill="#d4d4d8">id</text>
        <text x="704" y="133" fill="#71717a">full_name</text>
        <text x="704" y="155" fill="#5fd4ad">region_id</text>
      </g>
      <g class="node n2">
        <rect x="690.5" y="256.5" width="150" height="103" rx="10" fill="#131315" stroke="#ffffff" stroke-opacity="0.08" />
        <text x="704" y="278" fill="#e4e4e7" font-size="12">regions</text>
        <line x1="691" x2="840" y1="288.5" y2="288.5" stroke="#ffffff" stroke-opacity="0.06" />
        <text x="704" y="303" fill="#d4d4d8">id</text>
        <text x="704" y="325" fill="#71717a">name</text>
        <text x="704" y="347" fill="#71717a">code</text>
      </g>
      <g class="node n3">
        <rect x="900.5" y="160.5" width="150" height="103" rx="10" fill="#131315" stroke="#5fd4ad" stroke-opacity="0.28" />
        <text x="914" y="182" fill="#fafafa" font-size="12">orders</text>
        <line x1="901" x2="1050" y1="192.5" y2="192.5" stroke="#ffffff" stroke-opacity="0.06" />
        <text x="914" y="207" fill="#d4d4d8">id</text>
        <text x="914" y="229" fill="#5fd4ad">customer_id</text>
        <text x="914" y="251" fill="#71717a">status</text>
      </g>
      <g class="node n4">
        <rect x="1100.5" y="64.5" width="150" height="103" rx="10" fill="#131315" stroke="#ffffff" stroke-opacity="0.08" />
        <text x="1114" y="86" fill="#e4e4e7" font-size="12">order_items</text>
        <line x1="1101" x2="1250" y1="96.5" y2="96.5" stroke="#ffffff" stroke-opacity="0.06" />
        <text x="1114" y="111" fill="#d4d4d8">id</text>
        <text x="1114" y="133" fill="#5fd4ad">order_id</text>
        <text x="1114" y="155" fill="#5fd4ad">product_id</text>
      </g>
      <g class="node n5">
        <rect x="1100.5" y="256.5" width="150" height="103" rx="10" fill="#131315" stroke="#ffffff" stroke-opacity="0.08" />
        <text x="1114" y="278" fill="#e4e4e7" font-size="12">products</text>
        <line x1="1101" x2="1250" y1="288.5" y2="288.5" stroke="#ffffff" stroke-opacity="0.06" />
        <text x="1114" y="303" fill="#d4d4d8">id</text>
        <text x="1114" y="325" fill="#71717a">name</text>
        <text x="1114" y="347" fill="#71717a">price_cents</text>
      </g>
    </g>

    <g stroke="#5fd4ad" stroke-width="1.5" stroke-linecap="round" fill="none">
      <path id="e1" class="edge e1" pathLength="1" d="M900 225 C868 225 872 107 840 107" />
      <path id="e2" class="edge e2" pathLength="1" d="M1100 129 C1072 129 1078 203 1050 203" />
      <path id="e3" class="edge e3" pathLength="1" d="M1100 151 C1068 151 1068 299 1100 299" />
      <path id="e4" class="edge e4" pathLength="1" d="M690 151 C656 151 656 299 690 299" />
    </g>
    <g fill="#5fd4ad">
      <circle r="2.5" opacity="0">
        <set attributeName="opacity" to="0.9" begin="2.6s" />
        <animateMotion dur="2.8s" begin="2.6s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.65 0 0.35 1"><mpath href="#e1" /></animateMotion>
      </circle>
      <circle r="2.5" opacity="0">
        <set attributeName="opacity" to="0.9" begin="3.4s" />
        <animateMotion dur="3.2s" begin="3.4s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.65 0 0.35 1"><mpath href="#e3" /></animateMotion>
      </circle>
    </g>

    <!-- copy sits on a fade so long words never collide with the diagram -->
    <rect width="1280" height="420" fill="url(#fade)" />

    <g transform="translate(72 88)">
      <g class="rise d1"><g transform="scale(2)">
        <rect x="2.5" y="3" width="8" height="6" rx="1.6" stroke="#e4e4e7" stroke-width="1.5" />
        <rect x="13.5" y="15" width="8" height="6" rx="1.6" stroke="#e4e4e7" stroke-width="1.5" />
        <rect x="13.5" y="3" width="8" height="6" rx="1.6" stroke="#e4e4e7" stroke-width="1.5" opacity="0.45" />
        <path d="M6.5 9v4.5a1.5 1.5 0 0 0 1.5 1.5h5.5" stroke="#5fd4ad" stroke-width="1.5" stroke-linecap="round" />
      </g></g>
    </g>
    <text class="sans rise d2" x="70" y="206" fill="#fafafa" font-size="64" font-weight="650" letter-spacing="-2.4">Viewdata</text>
    <text class="sans rise d3" x="72" y="250" fill="#a1a1aa" font-size="20">A desktop explorer with live analytics,</text>
    <text class="sans rise d3" x="72" y="278" fill="#a1a1aa" font-size="20">readable foreign keys and schemas that arrange themselves.</text>
    <text class="mono rise d4" x="72" y="340" fill="#71717a" font-size="12.5" letter-spacing="2.2" xml:space="preserve">POSTGRESQL  /  MYSQL  /  MARIADB  /  ORACLE  /  MONGODB</text>
    <rect class="rise d5" x="72" y="358" width="44" height="2" rx="1" fill="#5fd4ad" />
  </g>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="23.5" stroke="#ffffff" stroke-opacity="0.07" />
</svg>
